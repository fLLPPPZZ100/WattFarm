<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WattFarm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      All three families are pixel typefaces, so nothing in the interface falls
      back to a smooth modern sans. Inter and JetBrains Mono used to sit here and
      were the one part of the UI that did not match the 8-bit surfaces.

      Pixelify Sans ships a variable weight axis, so 400..700 is one file rather
      than four. VT323 is single weight by design.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-bg-abyss text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
